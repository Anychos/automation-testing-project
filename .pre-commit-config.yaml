repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Check Python code and imports
        entry: ruff check --no-cache --select E4,E7,E9,F,I
        language: system
        types: [python]

      - id: ruff-format
        name: Check Python formatting
        entry: ruff format --no-cache --check
        language: system
        types: [python]
