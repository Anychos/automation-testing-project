[pytest]
minversion = 7.0
testpaths =
    tests/api
pythonpath =
    .
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts = -ra
markers =
    smoke: короткий набор критичных позитивных API-проверок
    regression: полный набор API-проверок, включая негативные сценарии
    positive: успешный сценарий API
    negative: сценарий API с ожидаемым отказом или ошибкой
    auth: API-сценарии регистрации и входа
    users: API-сценарии пользователей
    rooms: API-сценарии комнат
    bookings: API-сценарии бронирований
    payments: API-сценарии оплаты бронирований
    health: API-сценарии доступности сервиса
